<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Price dashboard</title>
<style>
:root{--bg:#f4f6f8;--s:#fff;--ink:#14263a;--mu:#5d6b7a;--ln:#dde3ea;--ac:#ffbb32;--ai:#2b1d00}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1b28;--s:#17283a;--ink:#e8eef4;--mu:#9fb0c1;--ln:#2a3e52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--ac);color:var(--ai)}
header img{width:48px;height:48px;border-radius:50%}header b{font-size:1.15rem;margin-inline-end:auto}
.btn{border:0;background:#fff;color:#14263a;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--ac);color:var(--ai)}main{max-width:1000px;margin:0 auto;padding:20px}
.panel{background:var(--s);border:1px solid var(--ln);border-top:4px solid var(--ac);border-radius:10px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.2rem}h3{margin:18px 0 8px;font-size:1rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
input{width:110px;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=password]{width:100%;margin:6px 0 12px}
.bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#st{color:var(--mu)}.err{color:#c0392b}.ok{color:#1f8a4c}
</style></head><body>

<main>
<section class="panel" id="login" style="max-width:420px"><h2>Sign in</h2>
<label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn p" id="in">Sign in</button><p id="le" class="err"></p></section>
<div id="ed" hidden>
<div class="g">
<section class="panel"><h2>By air ($ per kg)</h2><div id="air"></div><h3>Delivery time (days)</h3>
<div class="r"><span>From</span><input type="number" min="1" id="airMin"></div><div class="r"><span>To</span><input type="number" min="1" id="airMax"></div></section>
<section class="panel"><h2>By sea ($ per CBM)</h2><div id="sea"></div><h3>Delivery time (days)</h3>
<div class="r"><span>From</span><input type="number" min="1" id="seaMin"></div><div class="r"><span>To</span><input type="number" min="1" id="seaMax"></div></section>
</div>
<div class="bar"><button class="btn p" id="save">Save prices</button><span id="st"></span></div>
</div></main>
<script>
const DEF={air:{n:9,u:9.25,c:9.5,m:9.5,e:9.75},sea:{n:165,u:170,e:170,c:180,h:180,m:190},airMin:8,airMax:12,seaMin:30,seaMax:35};
const NM={n:'Normal goods',u:'Unbranded goods',c:'Cosmetics',m:'Medical goods',e:'Electronics',h:'Heavy goods'};
const $=i=>document.getElementById(i);let data=structuredClone(DEF),pw='';
async function load(){try{const d=await(await fetch('/api/prices',{cache:'no-store'})).json();if(d&&d.air&&d.sea)data={...DEF,...d,air:{...DEF.air,...d.air},sea:{...DEF.sea,...d.sea}}}catch{}}
function draw(){
  for(const g of ['air','sea'])$(g).innerHTML=Object.keys(data[g]).map(k=>`<div class="r"><label for="${g}-${k}">${NM[k]}</label><input type="number" min="0" step="0.05" id="${g}-${k}" data-g="${g}" data-k="${k}" value="${data[g][k]}"></div>`).join('');
  for(const k of ['airMin','airMax','seaMin','seaMax'])$(k).value=data[k];
}
const put=()=>fetch('/api/prices',{method:'PUT',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(data)});
function read(){
  document.querySelectorAll('[data-g]').forEach(i=>data[i.dataset.g][i.dataset.k]=parseFloat(i.value));
  for(const k of ['airMin','airMax','seaMin','seaMax'])data[k]=parseInt($(k).value,10);
}
function say(t,c){const s=$('st');s.textContent=t;s.className=c||''}
async function enter(){
  pw=$('pw').value||sessionStorage.getItem('pw')||'';
  await load();
  const r=await put().catch(()=>null);
  if(!r){$('le').textContent='Cannot reach the server. Make sure the site is deployed on Cloudflare.';return}
  if(r.status===401){sessionStorage.removeItem('pw');$('le').textContent='Wrong password.';return}
  sessionStorage.setItem('pw',pw);$('login').hidden=true;$('ed').hidden=false;draw();
}
$('in').onclick=enter;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
$('ed').addEventListener('input',()=>say('Unsaved changes'));
$('save').onclick=async()=>{
  read();say('Saving...');
  const r=await put().catch(()=>null);
  if(r&&r.ok)say('Saved. The client page now shows the new prices.','ok');
  else say(r&&r.status===400?'Check the numbers: prices must be zero or more, and "From" days cannot be above "To".':'Could not save. Sign in again.','err');
};
if(sessionStorage.getItem('pw'))enter();
</script></body></html>
